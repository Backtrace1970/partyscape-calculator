<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PartyScape Progress & Crafting Calculator</title>
  <style>
    body {
      background-color: #121214;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 900px;
      margin: 0 auto;
      padding: 20px;
    }
    .card {
      background: #1e1e24;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
      border: 1px solid #2d2d35;
    }
    h2 { color: #f5a623; margin-top: 0; }
    input, select, button {
      background: #2b2b36;
      color: #fff;
      border: 1px solid #3f3f50;
      padding: 10px;
      border-radius: 5px;
      margin: 5px 0;
      box-sizing: border-box;
    }
    button {
      background: #f5a623;
      color: #121214;
      font-weight: bold;
      cursor: pointer;
      border: none;
    }
    button:hover { background: #d98e19; }
    .stat-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 10px;
    }
    .stat-box {
      background: #252530;
      padding: 10px;
      border-radius: 5px;
      text-align: center;
      border: 1px solid #383845;
    }
    .row { display: flex; gap: 10px; flex-wrap: wrap; }
    .col { flex: 1; min-width: 200px; }
  </style>
</head>
<body>

  <h1>PartyScape Tools & Calculator</h1>

  <!-- 1. Connect Account -->
  <div class="card">
    <h2>1. Connect Your Account</h2>
    <p style="font-size: 0.9em; color: #aaa;">Enter your read-only API token from PartyScape (Account › API). Your token stays in your browser and is never saved to a server.</p>
    <div class="row">
      <input type="password" id="tokenInput" placeholder="Paste your psk_... token here" style="flex: 1;">
      <button onclick="saveToken()">Connect API</button>
    </div>
    <p id="statusMsg" style="font-size: 0.9em; color: #f5a623; margin-top: 5px;"></p>
  </div>

  <!-- 2. Live Skill Progress -->
  <div class="card">
    <h2>2. Your Skill Levels</h2>
    <div id="skillsGrid" class="stat-grid">
      <p>Enter an API token above to fetch your live skill levels...</p>
    </div>
  </div>

  <!-- 3. Leveling Calculator -->
  <div class="card">
    <h2>3. Leveling Calculator</h2>
    <div class="row">
      <div class="col">
        <label>Skill Category:</label><br>
        <select id="skillSelect" style="width: 100%;" onchange="populateRecipes()">
          <option value="Tailoring">Tailoring</option>
          <option value="Crafting">Crafting</option>
          <option value="Woodcutting">Woodcutting</option>
        </select>
      </div>
      <div class="col">
        <label>Target Recipe:</label><br>
        <select id="recipeSelect" style="width: 100%;"></select>
      </div>
    </div>
    <br>
    <div class="row">
      <div class="col">
        <label>Current XP:</label><br>
        <input type="number" id="currentXp" value="0" style="width: 100%;">
      </div>
      <div class="col">
        <label>Target Level (1-99):</label><br>
        <input type="number" id="targetLevel" value="80" max="99" style="width: 100%;">
      </div>
    </div>
    <br>
    <button onclick="calculateCrafts()" style="width: 100%; padding: 12px;">Calculate Actions Needed</button>

    <div id="calcResults" style="margin-top: 15px;"></div>
  </div>

  <script>
    let recipesData = {};

    function getXpForLevel(level) {
      let total = 0;
      for (let l = 1; l < level; l++) {
        total += Math.floor(l + 300 * Math.pow(2, l / 7.0));
      }
      return Math.floor(total / 4);
    }

    document.addEventListener("DOMContentLoaded", async () => {
  // 1. Fetch static game requirements directly from PartyScape's Public API
  try {
    const apiRes = await fetch("https://partyscape.club/api/v1/public/game/requirements");
    if (apiRes.ok) {
      gameRequirements = await apiRes.json();
      console.log("PartyScape Static Requirements Loaded:", gameRequirements);
    }
  } catch (err) {
    console.error("Could not load static game requirements from API:", err);
  }

  // 2. Load local recipes.json
  try {
    const res = await fetch("recipes.json");
    recipesData = await res.json();
    populateRecipes();
  } catch (e) {
    console.error("Could not load recipes.json", e);
  }

  // 3. Auto-load saved user API Token if present
  const savedToken = localStorage.getItem("partyscape_token");
  if (savedToken) {
    document.getElementById("tokenInput").value = savedToken;
    fetchPlayerData(savedToken);
  }
});

      // Load Token
      const savedToken = localStorage.getItem("partyscape_token");
      if (savedToken) {
        document.getElementById("tokenInput").value = savedToken;
        fetchPlayerData(savedToken);
      }
    });

    function saveToken() {
      const token = document.getElementById("tokenInput").value.trim();
      if (token) {
        localStorage.setItem("partyscape_token", token);
        fetchPlayerData(token);
      }
    }

    async function fetchPlayerData(token) {
      const status = document.getElementById("statusMsg");
      status.innerText = "Connecting to PartyScape API...";
      try {
        const response = await fetch("https://partyscape.club/api/v1/me/skills", {
          headers: { "Authorization": `Bearer ${token}` }
        });

        if (!response.ok) throw new Error("Invalid token or API issue");

        const data = await response.json();
        status.innerText = "Connected! Profile loaded successfully.";
        renderSkills(data.skills);
      } catch (err) {
        status.innerText = "Error: " + err.message;
      }
    }

    function renderSkills(skills) {
      const grid = document.getElementById("skillsGrid");
      grid.innerHTML = "";
      skills.forEach(s => {
        const div = document.createElement("div");
        div.className = "stat-box";
        div.innerHTML = `<strong>${s.skill}</strong><br>Level ${s.level}<br><small>${s.xp.toLocaleString()} XP</small>`;
        grid.appendChild(div);
      });
    }

    function populateRecipes() {
      const skill = document.getElementById("skillSelect").value;
      const recipeSelect = document.getElementById("recipeSelect");
      recipeSelect.innerHTML = "";

      if (recipesData[skill]) {
        recipesData[skill].forEach(item => {
          const opt = document.createElement("option");
          opt.value = item.xp;
          opt.textContent = `${item.name} (${item.xp} XP)`;
          recipeSelect.appendChild(opt);
        });
      }
    }

    function calculateCrafts() {
      const currentXp = parseInt(document.getElementById("currentXp").value) || 0;
      const targetLvl = parseInt(document.getElementById("targetLevel").value) || 99;
      const recipeXp = parseFloat(document.getElementById("recipeSelect").value) || 1;

      const targetXp = getXpForLevel(targetLvl);
      const xpNeeded = targetXp - currentXp;

      if (xpNeeded <= 0) {
        document.getElementById("calcResults").innerHTML = "<p style='color: #4caf50;'>You have already reached this target!</p>";
        return;
      }

      const actionsNeeded = Math.ceil(xpNeeded / recipeXp);
      document.getElementById("calcResults").innerHTML = `
        <div style="background: #252530; padding: 15px; border-radius: 5px;">
          <p style="margin: 5px 0;"><strong>Target Level ${targetLvl} Total XP:</strong> ${targetXp.toLocaleString()} XP</p>
          <p style="margin: 5px 0;"><strong>Remaining XP Needed:</strong> ${xpNeeded.toLocaleString()} XP</p>
          <p style="margin: 5px 0; color: #f5a623;"><strong>Actions / Items Required:</strong> ${actionsNeeded.toLocaleString()} crafts</p>
        </div>
      `;
    }
  </script>
</body>
</html>
