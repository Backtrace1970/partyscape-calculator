<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PartyScape Progress & Crafting Calculator</title>
  <style>
    body {
      background-color: #121214;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 900px;
      margin: 0 auto;
      padding: 20px;
    }
    .card {
      background: #1e1e24;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
      border: 1px solid #2d2d35;
    }
    h2 { color: #f5a623; margin-top: 0; }
    input, select, button {
      background: #2b2b36;
      color: #fff;
      border: 1px solid #3f3f50;
      padding: 10px;
      border-radius: 5px;
      margin: 5px 0;
      box-sizing: border-box;
    }
    button {
      background: #f5a623;
      color: #121214;
      font-weight: bold;
      cursor: pointer;
      border: none;
    }
    button:hover { background: #d98e19; }
    .stat-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 10px;
    }
    .stat-box {
      background: #252530;
      padding: 10px;
      border-radius: 5px;
      text-align: center;
      border: 1px solid #383845;
    }
    .row { display: flex; gap: 10px; flex-wrap: wrap; }
    .col { flex: 1; min-width: 200px; }
  </style>
</head>
<body>

  <h1>PartyScape Tools & Calculator</h1>

  <!-- 1. Connect Account -->
  <div class="card">
    <h2>1. Connect Your Account</h2>
    <p style="font-size: 0.9em; color: #aaa;">Enter your read-only API token from PartyScape (Account › API). Your token stays in your browser and is never saved to a server.</p>
    <div class="row">
      <input type="password" id="tokenInput" placeholder="Paste your psk_... token here" style="flex: 1;">
      <button onclick="saveToken()">Connect API</button>
    </div>
    <p id="statusMsg" style="font-size: 0.9em; color: #f5a623; margin-top: 5px;"></p>
  </div>

  <!-- 2. Live Skill Progress -->
  <div class="card">
    <h2>2. Your Skill Levels</h2>
    <div id="skillsGrid" class="stat-grid">
      <p>Enter an API token above to fetch your live skill levels...</p>
    </div>
  </div>

  <!-- 3. Leveling Calculator -->
  <div class="card">
    <h2>3. Leveling Calculator</h2>
    <div class="row">
      <div class="col">
        <label>Skill Category:</label><br>
        <select id="skillSelect" style="width: 100%;" onchange="populateRecipes()"></select>
      </div>
      <div class="col">
        <label>Target Recipe:</label><br>
        <select id="recipeSelect" style="width: 100%;"></select>
      </div>
    </div>
    <br>
    <div class="row">
      <div class="col">
        <label>Current XP:</label><br>
        <input type="number" id="currentXp" value="0" style="width: 100%;">
      </div>
      <div class="col">
        <label>Target Level (1-99):</label><br>
        <input type="number" id="targetLevel" value="80" max="99" style="width: 100%;">
      </div>
    </div>
    <br>
    <button onclick="calculateCrafts()" style="width: 100%; padding: 12px;">Calculate Actions Needed</button>

    <div id="calcResults" style="margin-top: 15px;"></div>
  </div>

  <script>
    let gameRequirements = {}; 
    let recipesData = {};      

    function getXpForLevel(level) {
      let total = 0;
      for (let l = 1; l < level; l++) {
        total += Math.floor(l + 300 * Math.pow(2, l / 7.0));
      }
      return Math.floor(total / 4);
    }

    document.addEventListener("DOMContentLoaded", async () => {
      // 1. Fetch static game requirements (HTTPS)
      try {
        const apiRes = await fetch("https://partyscape.club/api/v1/public/game/requirements");
        if (apiRes.ok) {
          gameRequirements = await apiRes.json();
        }
      } catch (err) {
        console.error("Failed to load static game requirements:", err);
      }

      // 2. Load local recipes.json
      try {
        const res = await fetch("recipes.json");
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        recipesData = await res.json();
        populateSkillCategories(); // Populate skills dynamically from JSON keys
      } catch (e) {
        console.error("Could not load recipes.json:", e);
        document.getElementById("statusMsg").innerText = "Warning: recipes.json could not be loaded.";
      }

      // 3. Auto-load saved user API Token if present
      const savedToken = localStorage.getItem("partyscape_token");
      if (savedToken) {
        document.getElementById("tokenInput").value = savedToken;
        fetchPlayerData(savedToken);
      }
    });

    function saveToken() {
      const token = document.getElementById("tokenInput").value.trim();
      if (token) {
        localStorage.setItem("partyscape_token", token);
        fetchPlayerData(token);
      } else {
        document.getElementById("statusMsg").innerText = "Please enter a valid API token.";
      }
    }

    async function fetchPlayerData(token) {
      const status = document.getElementById("statusMsg");
      status.innerText = "Connecting to PartyScape API...";
      
      try {
        const response = await fetch("https://partyscape.club/api/v1/me/skills", {
          headers: { "Authorization": `Bearer ${token}` }
        });

        if (!response.ok) {
          throw new Error(`API Returned Status ${response.status}`);
        }

        const data = await response.json();
        status.innerText = "Connected! Profile loaded successfully.";
        renderSkills(data.skills || []);
      } catch (err) {
        console.error("Fetch Player Data Error:", err);
        status.innerText = "Error connecting: " + err.message;
      }
    }

    function renderSkills(skills) {
      const grid = document.getElementById("skillsGrid");
      grid.innerHTML = "";
      if (!skills || skills.length === 0) {
        grid.innerHTML = "<p>No skill data returned.</p>";
        return;
      }
      skills.forEach(s => {
        const div = document.createElement("div");
        div.className = "stat-box";
        div.innerHTML = `<strong>${s.skill}</strong><br>Level ${s.level}<br><small>${s.xp ? s.xp.toLocaleString() : 0} XP</small>`;
        grid.appendChild(div);
      });
    }

    // Dynamically fills skill categories from the keys in recipes.json
    function populateSkillCategories() {
      const skillSelect = document.getElementById("skillSelect");
      skillSelect.innerHTML = "";

      const categories = Object.keys(recipesData);
      if (categories.length === 0) return;

      categories.forEach(category => {
        const opt = document.createElement("option");
        opt.value = category;
        opt.textContent = category;
        skillSelect.appendChild(opt);
      });

      // Automatically load the recipes for the first skill category
      populateRecipes();
    }

    // Populates the target recipes when a skill category is selected
function populateRecipes() {
  const skill = document.getElementById("skillSelect").value;
  const recipeSelect = document.getElementById("recipeSelect");
  recipeSelect.innerHTML = "";

  if (recipesData[skill]) {
    recipesData[skill].forEach((item, index) => {
      const opt = document.createElement("option");
      // Store the index so we can retrieve full recipe details easily
      opt.value = index;
      opt.textContent = `${item.name} (${item.xp} XP / ${item.timeSec || item.time || 2.5}s)`;
      recipeSelect.appendChild(opt);
    });
  }
}

function calculateCrafts() {
  const currentXp = parseInt(document.getElementById("currentXp").value) || 0;
  const targetLvl = parseInt(document.getElementById("targetLevel").value) || 99;
  
  const skill = document.getElementById("skillSelect").value;
  const recipeSelect = document.getElementById("recipeSelect");
  
  if (recipeSelect.value === "") return;

  const selectedIndex = parseInt(recipeSelect.value);
  const selectedRecipe = recipesData[skill][selectedIndex];

  if (!selectedRecipe) return;

  const recipeXp = selectedRecipe.xp || 1;
  const actionTime = selectedRecipe.timeSec || selectedRecipe.time || 2.5;

  const targetXp = getXpForLevel(targetLvl);
  const xpNeeded = targetXp - currentXp;

  if (xpNeeded <= 0) {
    document.getElementById("calcResults").innerHTML = "<p style='color: #4caf50;'>You have already reached this target!</p>";
    return;
  }

  const actionsNeeded = Math.ceil(xpNeeded / recipeXp);
  const totalSeconds = actionsNeeded * actionTime;
  const formattedTime = formatTime(totalSeconds);

  // Build the Required Inputs HTML list
  let inputsHtml = "";
  if (selectedRecipe.inputs && Object.keys(selectedRecipe.inputs).length > 0) {
    inputsHtml += "<p style='margin: 10px 0 5px 0;'><strong>Raw Materials / Inputs Required:</strong></p><ul style='margin: 0; padding-left: 20px;'>";
    
    for (const [material, amountPerCraft] of Object.entries(selectedRecipe.inputs)) {
      const totalRequired = amountPerCraft * actionsNeeded;
      inputsHtml += `<li><strong>${material}:</strong> ${totalRequired.toLocaleString()} (${amountPerCraft} per craft)</li>`;
    }
    
    inputsHtml += "</ul>";
  } else {
    inputsHtml = "<p style='margin: 10px 0 5px 0;'><strong>Raw Materials / Inputs Required:</strong> None</p>";
  }

  // Render complete results
  document.getElementById("calcResults").innerHTML = `
    <div style="background: #252530; padding: 15px; border-radius: 5px;">
      <p style="margin: 5px 0;"><strong>Target Level ${targetLvl} Total XP:</strong> ${targetXp.toLocaleString()} XP</p>
      <p style="margin: 5px 0;"><strong>Remaining XP Needed:</strong> ${xpNeeded.toLocaleString()} XP</p>
      <p style="margin: 5px 0; color: #f5a623;"><strong>Actions / Items Required:</strong> ${actionsNeeded.toLocaleString()} crafts</p>
      <p style="margin: 5px 0; color: #4caf50;"><strong>Estimated Time:</strong> ${formattedTime} (${totalSeconds.toLocaleString()} seconds)</p>
      <hr style="border: 0; border-top: 1px solid #383845; margin: 10px 0;">
      ${inputsHtml}
    </div>
  `;
}

    // Formats total seconds into human-readable duration
    function formatTime(totalSeconds) {
      if (totalSeconds < 60) {
        return "< 1 minute";
      }

      const days = Math.floor(totalSeconds / 86400);
      const hours = Math.floor((totalSeconds % 86400) / 3600);
      const minutes = Math.floor((totalSeconds % 3600) / 60);

      let parts = [];
      if (days > 0) parts.push(`${days}d`);
      if (hours > 0) parts.push(`${hours}h`);
      if (minutes > 0) parts.push(`${minutes}m`);

      return parts.join(" ");
    }

    function calculateCrafts() {
      const currentXp = parseInt(document.getElementById("currentXp").value) || 0;
      const targetLvl = parseInt(document.getElementById("targetLevel").value) || 99;
      
      const recipeSelect = document.getElementById("recipeSelect");
      if (!recipeSelect.value) return;

      const selectedOption = recipeSelect.options[recipeSelect.selectedIndex];
      const recipeXp = parseFloat(selectedOption.value) || 1;
      const actionTime = parseFloat(selectedOption.dataset.timeSec) || 2.5;

      const targetXp = getXpForLevel(targetLvl);
      const xpNeeded = targetXp - currentXp;

      if (xpNeeded <= 0) {
        document.getElementById("calcResults").innerHTML = "<p style='color: #4caf50;'>You have already reached this target!</p>";
        return;
      }

      const actionsNeeded = Math.ceil(xpNeeded / recipeXp);
      const totalSeconds = actionsNeeded * actionTime;
      const formattedTime = formatTime(totalSeconds);

      document.getElementById("calcResults").innerHTML = `
        <div style="background: #252530; padding: 15px; border-radius: 5px;">
          <p style="margin: 5px 0;"><strong>Target Level ${targetLvl} Total XP:</strong> ${targetXp.toLocaleString()} XP</p>
          <p style="margin: 5px 0;"><strong>Remaining XP Needed:</strong> ${xpNeeded.toLocaleString()} XP</p>
          <p style="margin: 5px 0; color: #f5a623;"><strong>Actions / Items Required:</strong> ${actionsNeeded.toLocaleString()} crafts</p>
          <p style="margin: 5px 0; color: #4caf50;"><strong>Estimated Time:</strong> ${formattedTime} (${totalSeconds.toLocaleString()} seconds)</p>
        </div>
      `;
    }
  </script>
</body>
</html>
